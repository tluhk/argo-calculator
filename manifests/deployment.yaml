apiVersion: apps/v1
kind: Deployment
metadata:
  name: calculator-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: calculator
  template:
    metadata:
      labels:
        app: calculator
    spec:
      containers:
        - name: calculator
          image: ghcr.io/tluhk/calculator@sha256:0331520913c67d595436a13619b09d8a1f8396af3a95f1377a4fc06ea20b9272
          imagePullPolicy: Always
          ports:
            - containerPort: 3030 # Rakenduse sees töötav port
      imagePullSecrets:
        - name: ghcr-secret
